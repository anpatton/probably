[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probably"
version = "0.1.0"
description = "Helper functions and wrappers for modeling and data science work involving probability distributions and Monte Carlo simulation. Compatible with scikit-learn."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Andrew Patton", email = "anpatt7@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "black",
    "build",
    "twine",
    "scipy-stubs",
]

[project.urls]
Homepage = "https://github.com/andrewpatton/probably"
Repository = "https://github.com/andrewpatton/probably"

[tool.hatch.build.targets.wheel]
packages = ["src/probably"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true

# scikit-learn ships no py.typed marker and has no maintained stub package,
# so mypy cannot analyze it. Scoped to sklearn only; everything else stays strict.
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

# Probably* estimators subclass BaseEstimator and the sklearn mixins, which
# mypy sees as Any for the reason above. Allow that in the one package that
# defines them; everything else still forbids subclassing Any.
[[tool.mypy.overrides]]
module = "probably.predict.*"
disallow_subclassing_any = false

[tool.pytest.ini_options]
# src is collected too so every public docstring's Examples block is executed,
# not just the tests/ suite.
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.coverage.run]
source = ["src/probably"]
