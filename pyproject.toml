[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probably"
version = "0.1.0"
description = "Helper functions and wrappers for modeling and data science work involving probability distributions and Monte Carlo simulation. Compatible with scikit-learn."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Andrew Patton", email = "anpatt7@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "black",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/andrewpatton/probably"
Repository = "https://github.com/andrewpatton/probably"

[tool.hatch.build.targets.wheel]
packages = ["src/probably"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/probably"]
